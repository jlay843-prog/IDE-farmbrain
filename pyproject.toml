[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-desk"
version = "1.3.10"
description = "Local Qwen coding desk for the farm mesh — CLI first, thin Windows window second."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jeff Lay" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
